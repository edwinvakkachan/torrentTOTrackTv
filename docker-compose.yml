version: "3.8"

services:
  torrenttotraktv:
    build: .
    container_name: torrenttotraktv
    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      QBITIP: ${QBITIP}
      QBITUSER: ${QBITUSER}
      QBITPASS: ${QBITPASS}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN}
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      RADARR_ROOT_FOLDER: ${RADARR_ROOT_FOLDER}
      RADARR_PREDVD_ROOT_FOLDER: ${RADARR_PREDVD_ROOT_FOLDER}
      HA_WEBHOOKERROR_URL: ${HA_WEBHOOKERROR_URL}
      RADARR_QUALITY_PROFILE_ID: ${RADARR_QUALITY_PROFILE_ID}
      SONARR_URL: ${SONARR_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      SONARR_ROOT_FOLDER: ${SONARR_ROOT_FOLDER}
      SONARR_QUALITY_PROFILE_ID: ${SONARR_QUALITY_PROFILE_ID}
      SONARR_LANGUAGE_PROFILE_ID: ${SONARR_LANGUAGE_PROFILE_ID}
      
    dns:
      - 1.1.1.1
      - 1.0.0.1



    volumes:
      - app_logs:/app/logs

volumes:
  app_logs: